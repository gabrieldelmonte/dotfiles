# ~/.xscreensaver — xscreensaver lock screen (comparison build, not in use yet).
# Locking is started by rofi/scripts/lock.sh (xss-lock, Super+Shift+X), so
# xscreensaver's own idle timer is effectively off.
timeout:        720:00:00
lock:           True
lockTimeout:    0:00:00
passwdTimeout:  0:00:30
fade:           False
unfade:         False
splash:         False
dpmsEnabled:    False
mode:           one
selected:       0
newLoginCommand:
programs:       "Video" $HOME/.config/dotfiles/lockscreen/saver_video \n
dialogTheme:    latte
