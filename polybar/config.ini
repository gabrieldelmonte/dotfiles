; ============================================================
;  polybar — Catppuccin Latte (generated by scripts/gen-polybar.py)
; ============================================================

[colors]
base      = #eff1f5
mantle    = #e6e9ef
crust     = #dce0e8
text      = #4c4f69
subtext1  = #5c5f77
subtext0  = #6c6f85
overlay2  = #7c7f93
overlay1  = #8c8fa1
overlay0  = #9ca0b0
surface2  = #acb0be
surface1  = #bcc0cc
surface0  = #ccd0da
rosewater = #dc8a78
flamingo  = #dd7878
pink      = #ea76cb
mauve     = #8839ef
red       = #d20f39
maroon    = #e64553
peach     = #fe640b
yellow    = #df8e1d
green     = #40a02b
teal      = #179299
sky       = #04a5e5
sapphire  = #209fb5
blue      = #1e66f5
lavender  = #7287fd
transparent = #00000000

; ============================================================

[bar/main]
monitor = ${env:MONITOR:}
width    = 100%:-24
offset-x = 12
offset-y = 8
height   = 26
fixed-center = true
wm-restack = bspwm

; Transparent bar: only the pills are drawn, like the tmux status line.
background = #00000000
foreground = #4c4f69
line-size  = 2

padding = 0
module-margin = 0

; T1 text, T2 icons, T3 pill caps (sized to fill the bar height)
font-0 = MartianMono Nerd Font Mono:style=Bold:size=10;3
; Propo: icons get their full width, so the next character does not clip them.
font-1 = MartianMono Nerd Font Propo:style=Bold:size=11;3
font-2 = MartianMono Nerd Font Mono:size=19;5
font-3 = Noto Color Emoji:scale=10;2

modules-left   = lcap bspwm rcap gap lcap cpu cputemp gpu memory rcap
modules-center = lcap date rcap
modules-right  = lcap xkeyboard pulseaudio backlight battery wlan eth bluetooth rcap gap tray gap lcap powerprofile notifications power rcap

cursor-click  = pointer
cursor-scroll = ns-resize
enable-ipc = true

; ============================================================
; Pill pieces

[module/lcap]
type = custom/text
format = "%{T3}%{F#ccd0da}%{F-}%{T-}"

[module/rcap]
type = custom/text
format = "%{T3}%{F#ccd0da}%{F-}%{T-}"

[module/gap]
type = custom/text
format = "  "

; ============================================================
; Left

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
; Only desktops with windows are listed; Super+N still reaches all ten.
label-focused  = "%{F#1e66f5}%name%%{F-}"
label-occupied = "%{F#6c6f85}%name%%{F-}"
label-urgent   = "%{F#d20f39}%name%%{F-}"
label-empty    =
; Shown while the desktop is maximized (monocle, Super+M / Super+Z).
label-monocle = "%{F#7287fd}%{T2}󰊓%{T-}%{F-}"
label-tiled =
label-focused-padding  = 1
label-occupied-padding = 1
label-urgent-padding   = 1
format = <label-state><label-mode>
format-background = #ccd0da

; ============================================================
; Left: system (CPU/RAM/GPU moved here from the tmux status bar)

[module/cpu]
; "<orange icon> usage" — the CPU temperature module follows right after it.
type = internal/cpu
format = "%{A1:alacritty --class floating-term,floating-term -e btop:}%{F#fe640b}%{T2}%{T-}%{F-} <label>%{A}"
label = %percentage%%
format-background = #ccd0da
format-prefix = " "

[module/cputemp]
type = custom/script
exec = ~/.config/polybar/scripts/cputemp.sh
click-left = alacritty --class floating-term,floating-term -e btop &
format = <label>
format-background = #ccd0da
format-padding = 1

[module/memory]
type = internal/memory
format = "%{A1:alacritty --class floating-term,floating-term -e btop:}%{F#1e66f5}%{T2}%{T-}%{F-} <label>%{A}"
label = %percentage_used%%
format-background = #ccd0da
format-padding = 1

[module/gpu]
type = custom/script
exec = ~/.config/polybar/scripts/gpu.sh
click-left = alacritty --class floating-term,floating-term -e btop &
format-background = #ccd0da
format-padding = 1

; ============================================================
; Center

[module/date]
type     = internal/date
interval = 5
date     = %a %d %b
time     = %H:%M
date-alt = %A, %d %B %Y
time-alt = %H:%M
format = "%{F#1e66f5}%{T2}%{T-}%{F-} <label>"
label  = %date%  %time%
format-background = #ccd0da
format-padding = 1

; ============================================================
; Right: system status

[module/xkeyboard]
type = internal/xkeyboard
; Click to switch layout. Shows CAPS while Caps Lock is on.
format = "%{F#7287fd}%{T2}󰌌%{T-}%{F-} <label-layout><label-indicator>"
label-layout = %layout%
label-indicator-on-capslock = " CAPS"
label-indicator-on-capslock-foreground = #d20f39
label-indicator-off =
blacklist-0 = num lock
blacklist-1 = scroll lock
format-background = #ccd0da
format-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
; Scroll: volume. Click: mute. Right-click: mixer.
format-volume = "%{F#209fb5}%{T2}<ramp-volume>%{T-}%{F-} <label-volume>"
format-muted  = "%{F#d20f39}%{T2}󰝟%{T-}%{F-} <label-muted>"
label-volume = %percentage%%
label-muted  = muted
label-muted-foreground = #8c8fa1
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
click-right = pavucontrol &
format-volume-background = #ccd0da
format-volume-padding = 1
format-muted-background = #ccd0da
format-muted-padding = 1

[module/backlight]
type = internal/backlight
; Notebook panel. Missing in the VM, where polybar simply hides the module.
card = intel_backlight
use-actual-brightness = true
enable-scroll = false
format = "%{F#df8e1d}%{T2}<ramp>%{T-}%{F-} <label>"
label = %percentage%%
ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠
format-background = #ccd0da
format-padding = 1

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
; 101 = never "full" just by percentage. The plug icon then only shows when
; the battery itself reports Full / Not charging, i.e. on the charger.
full-at = 101
low-at  = 15
time-format = %-Hh%M
format-charging    = "%{F#40a02b}%{T2}󰂄%{T-}%{F-} <label-charging>"
format-discharging = "%{F#40a02b}%{T2}<ramp-capacity>%{T-}%{F-} <label-discharging>"
format-full        = "%{F#40a02b}%{T2}󰚥%{T-}%{F-} <label-full>"
format-low         = "%{F#d20f39}%{T2}󰁺%{T-}%{F-} <label-low>"
label-charging    = %percentage%%
label-discharging = %percentage%% %{F#8c8fa1}%time%%{F-}
label-full        = full
label-low         = %percentage%% %time%
label-low-foreground = #d20f39
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹
format-charging-background = #ccd0da
format-charging-padding = 1
format-discharging-background = #ccd0da
format-discharging-padding = 1
format-full-background = #ccd0da
format-full-padding = 1
format-low-background = #ccd0da
format-low-padding = 1

[module/wlan]
type = internal/network
interface-type = wireless
format-connected    = "%{A1:~/.config/polybar/scripts/wifi-toggle.sh:}%{F#179299}%{T2}<ramp-signal>%{T-}%{F-}%{A} %{A1:~/.config/polybar/scripts/network.sh:}<label-connected>%{A}"
format-disconnected = "%{A1:~/.config/polybar/scripts/wifi-toggle.sh:}%{F#8c8fa1}%{T2}󰤮%{T-}%{F-}%{A} %{A1:~/.config/polybar/scripts/network.sh:}<label-disconnected>%{A}"
label-connected    = %essid:0:14:…%
label-disconnected = offline
label-disconnected-foreground = #8c8fa1
ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨
format-connected-background = #ccd0da
format-connected-padding = 1
format-disconnected-background = #ccd0da
format-disconnected-padding = 1

[module/eth]
type = internal/network
interface-type = wired
format-connected = "%{A1:~/.config/polybar/scripts/network.sh:}%{F#179299}%{T2}󰈀%{T-}%{F-} <label-connected>%{A}"
label-connected = wired
format-disconnected =
format-connected-background = #ccd0da
format-connected-padding = 1

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
click-left = blueman-manager &
format-background = #ccd0da
format-padding = 1

; ============================================================
; Right: tray and session

[module/tray]
type = internal/tray
tray-size = 60%
tray-spacing = 8px

[module/powerprofile]
type = custom/script
exec = ~/.config/polybar/scripts/powerprofile-bar.sh
tail = true
click-left = ~/.config/rofi/scripts/powerprofile.sh &
format-background = #ccd0da
format-padding = 1

[module/notifications]
type = custom/script
exec = ~/.config/polybar/scripts/notifications.sh
tail = true
click-left = dunstctl set-paused toggle; pkill -USR1 -f '^bash .*polybar/scripts/notifications[.]sh'
format-background = #ccd0da
format-padding = 1

[module/power]
type = custom/text
format = "%{F#d20f39}%{T2}󰐥%{T-}%{F-}"
click-left = ~/.config/rofi/scripts/powermenu.sh &
format-background = #ccd0da
format-padding = 1

[settings]
screenchange-reload = true
pseudo-transparency = false
