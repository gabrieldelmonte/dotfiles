# ============================================================
#  picom.conf — Catppuccin Latte, frosted glass (picom 10.x)
# ============================================================
# The glx backend is needed for dual_kawase blur. It also works in the
# QEMU VM: Mesa falls back to llvmpipe (software GL), which is slower but
# fine for testing. On real hardware it runs on the GPU.

# --- Backend ---
backend = "glx";
vsync = true;
use-damage = true;
glx-no-stencil = true;

# --- Blur ---
# Blur shows wherever a window is translucent: Alacritty (opacity 0.85),
# rofi and dunst use translucent Latte backgrounds. Polybar is excluded: its
# bar is fully transparent and only the opaque pills are drawn.
blur: {
    method   = "dual_kawase";
    strength = 3;
};
blur-background-frame = false;
blur-background-fixed = false;

blur-background-exclude = [
    "window_type = 'desktop'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "window_type = 'tooltip'",
    "class_g = 'slop'",
    "class_g = 'Peek'",
    "class_g = 'Polybar'",
    "_GTK_FRAME_EXTENTS@:c"
];

# --- Rounded corners ---
corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'desktop'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "window_type = 'tooltip'",
    "class_g = 'Dunst'",
    "fullscreen"
];
# Rofi is rounded by picom too (12 px, same as its theme), so its blur and
# shadow follow the curve instead of poking out as a square.

# --- Shadows ---
# Soft, low-contrast shadows suit a light theme better than dark halos.
shadow = true;
shadow-radius = 18;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-opacity = 0.14;
shadow-color = "#4c4f69";

shadow-exclude = [
    "class_g = 'Rofi'",   # rofi (override-redirect) gets a white halo instead of a shadow
    "window_type = 'desktop'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "window_type = 'tooltip'",
    "class_g = 'slop'",
    "_GTK_FRAME_EXTENTS@:c",
    "fullscreen"
];

# --- Fading ---
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 5;

# --- Opacity ---
# Unfocused windows dim slightly. Alacritty manages its own opacity (0.85).
active-opacity = 1.0;
inactive-opacity = 0.94;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
    "100:class_g = 'Rofi'",
    "100:class_g = 'Polybar'",
    "100:class_g = 'Dunst'",
    "100:class_g = 'i3lock'",
    "100:fullscreen"
];

# --- Window detection ---
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
unredir-if-possible = false;

wintypes: {
    tooltip       = { fade = true; shadow = false; focus = true; };
    dock          = { shadow = false; clip-shadow-above = true; };
    dnd           = { shadow = false; };
    popup_menu    = { opacity = 1.0; };
    dropdown_menu = { opacity = 1.0; };
};

log-level = "warn";
