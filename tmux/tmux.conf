# Prefix
unbind C-b
set -g prefix C-b
bind -N "Send the prefix key to the program" C-b send-prefix

# General
set -g mouse on
set -g history-limit 10000

set -g default-terminal "tmux-256color"
set -g default-shell /bin/zsh

set -s escape-time 10
set -g repeat-time 600

# Windows & Panes
# -N notes show up in `tmux list-keys -N` and in the desktop cheat sheet (Super+\).
bind -N "New window" C-c new-window

unbind C
# Ctrl+Shift+C (needs extended-keys, set below). "C-C" would be read as C-c
# and replace the new-window binding above.
bind -N "New session" C-S-c new-session

bind -N "Split pane: new one below" - split-window -v -c "#{pane_current_path}"
bind -N "Split pane: new one to the right" _ split-window -h -c "#{pane_current_path}"

bind -N "Focus pane left" -r h select-pane -L
bind -N "Focus pane right" -r l select-pane -R
bind -N "Focus pane up" -r k select-pane -U
bind -N "Focus pane down" -r j select-pane -D

# Swap the current pane with the one in a given direction, following it (no prefix needed)
bind -N "Swap pane left (follow it)" -n -r M-a swap-pane -t '{left-of}' \; select-pane -t '{left-of}'
bind -N "Swap pane right (follow it)" -n -r M-d swap-pane -t '{right-of}' \; select-pane -t '{right-of}'
bind -N "Swap pane up (follow it)" -n -r M-w swap-pane -t '{up-of}' \; select-pane -t '{up-of}'
bind -N "Swap pane down (follow it)" -n -r M-s swap-pane -t '{down-of}' \; select-pane -t '{down-of}'

# Rip the current pane out and re-split it next to the LAST active pane,
# reshaping the layout (e.g. turn A|B|C into A|B/C).
# Workflow: focus B, then focus C, then press a direction key below.
bind -N "Re-split pane left of the last pane" -n -r C-S-a join-pane -h -b -t '!'
bind -N "Re-split pane right of the last pane" -n -r C-S-d join-pane -h -t '!'
bind -N "Re-split pane above the last pane" -n -r C-S-w join-pane -v -b -t '!'
bind -N "Re-split pane below the last pane" -n -r C-S-s join-pane -v -t '!'

unbind n
unbind p
bind -N "Previous window" -r C-h previous-window
bind -N "Next window" -r C-l next-window
bind -N "Last window" Tab last-window

bind -N "Reload tmux config" r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Clipboard - Note: testing with Alacritty
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# Plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# System-stat plugins: their values now live in the desktop bar (polybar).
# Kept commented out — uncomment these (and the status-right lines further
# down) to show CPU / GPU / RAM / battery in tmux again, e.g. over SSH.
# set -g @plugin 'tmux-plugins/tmux-cpu'
# set -g @cpu_temp_unit "°C"
# set -g @cpu_temp_format "%3.0f"
# set -g @gpu_temp_unit "°C"
# set -g @gpu_temp_format "%3.0f"
# set -g @plugin 'tmux-plugins/tmux-battery'

set -g @plugin 'catppuccin/tmux'
# set -g @catppuccin_cpu_text " #{l:#{cpu_percentage}} #{l:#{cpu_temp}}"
# set -g @catppuccin_gpu_text "#{l:#{gpu_percentage}} #{l:#{gpu_temp}}"
# set -g @catppuccin_ram_text " #{l:#{ram_percentage}}"

# Theme
set -g status-interval 2
set -g status-position top

set -g @catppuccin_flavor 'latte'
set -g @catppuccin_window_status_style 'rounded'
#set -g @catppuccin_status_background 'default'
set -g @catppuccin_status_background 'none'

set -g status-right-length 160
set -g status-left-length 100

set -g status-left ""
set -g status-right ""

## Sessions:
set -g @catppuccin_session_icon " "
set -g @catppuccin_session_color "#{?client_prefix,#{E:@thm_red},#{E:@thm_green}}"
set -g @catppuccin_session_text "#(tmux ls -F '##S##{?session_attached,*,}' | tr '\\n' ' ' | sed 's/ $//')"

# Terminal context only. System stats (CPU, GPU, RAM, battery, clock) live in
# the desktop bar (polybar), so they are not repeated in every terminal.
set -g status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
# set -agF status-right "#{E:@catppuccin_status_gpu}"
# set -agF status-right "#{E:@catppuccin_status_ram}"
# set -agF status-right "#{E:@catppuccin_status_battery}"
# set -agF status-right "#{E:@catppuccin_status_date_time}"


# TPM
run '~/.tmux/plugins/tpm/tpm'

# Transparent window separators (must come after TPM).
#
# catppuccin's 'rounded' style draws the end caps as "#[fg=#{@_ctp_status_bg},reverse]".
# With a transparent bar @_ctp_status_bg is the literal "none", which is not a
# valid tmux colour, so tmux drops the whole style -- reverse included -- and the
# caps render in the pill's own colours. Reverse would not help anyway: tmux sends
# it to the terminal as SGR 7 and Alacritty renders reverse-video cells fully opaque.
#
# So build the caps the way the right-hand modules do: explicit fg, bg=default.
#
# NOTE: this overrides catppuccin's own builder, so @catppuccin_window_status_style,
# @catppuccin_window_flags and @catppuccin_window_number_position no longer have any
# effect -- 'rounded' / flags 'none' / number 'left' are baked into the lines below.
# Colours still follow @thm_*, so changing @catppuccin_flavor works as normal.
set -g window-status-format "#[fg=#{E:@catppuccin_window_number_color},bg=default]#[fg=#{@thm_crust},bg=#{E:@catppuccin_window_number_color}]#I #[fg=#{@thm_fg},bg=#{E:@catppuccin_window_text_color}] #T#[fg=#{E:@catppuccin_window_text_color},bg=default]#[none]"
set -g window-status-current-format "#[fg=#{E:@catppuccin_window_current_number_color},bg=default]#[fg=#{@thm_crust},bg=#{E:@catppuccin_window_current_number_color}]#I #[fg=#{@thm_fg},bg=#{E:@catppuccin_window_current_text_color}] #T#[fg=#{E:@catppuccin_window_current_text_color},bg=default]#[none]"

# --- Extended keys for Neovim -------------------------------------------------
# A classic terminal cannot tell Ctrl+P from Ctrl+Shift+P: both collapse to the
# same control byte. Ctrl+/, Ctrl+., Ctrl+Enter and Shift+Alt+<arrow> have the
# same problem. The fix is the CSI-u / modifyOtherKeys protocol, which has to be
# enabled at every layer: Alacritty speaks it, and these two lines make tmux
# request it from Alacritty and pass the decoded keys through to Neovim.
#
# `extended-keys on` forwards extended keys to programs that ask for them
# (Neovim does). If a chord still does not register, try `always` instead.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'alacritty:extkeys'

# Neovim wants a short escape-time so Alt+<key> is not mistaken for Esc then
# <key>. 10ms is already set above; keeping this note here so it is not undone.
